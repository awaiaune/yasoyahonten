<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>店舗管理｜八草屋本店</title><link rel="stylesheet" href="../css/admin.css"></head><body>
<header><p>YASOYA HONTEN</p><h1>店舗管理</h1></header>
<main>
<section id="login" class="card"><h2>管理者認証</h2><p>Cloudflareに設定した管理トークンを入力してください。</p><input id="token" type="password" autocomplete="current-password" placeholder="管理トークン"><button id="loginBtn">ログイン</button><p id="loginError" class="error"></p></section>
<section id="app" hidden><nav class="admin-nav" aria-label="管理メニュー"><button class="admin-nav-button active" data-panel="ordersPanel">注文管理</button><button class="admin-nav-button" data-panel="productsPanel">商品管理</button><button class="admin-nav-button" data-panel="inventoryPanel">在庫管理</button></nav><div id="ordersPanel"><div class="toolbar"><button class="tab active" data-status="pending">発送待ち <span id="pendingCount"></span></button><button class="tab" data-status="shipped">発送済み</button><button id="logout" class="sub">ログアウト</button></div><p id="status"></p><div id="orders"></div></div>
<section id="productsPanel" hidden><div class="toolbar"><h2>商品管理</h2><button id="newProduct">新規登録</button><button id="importProducts" class="sub">既存3商品を下書き取込</button><button id="reloadProducts" class="sub">更新</button></div><p id="managementMessage" role="status" aria-live="polite"></p><div id="productList"></div><h3>同期処理</h3><div id="jobList"></div><h3>変更履歴</h3><div id="auditList"></div></section>
<section id="inventoryPanel" hidden><div class="toolbar"><h2>在庫管理</h2><button id="reloadInventory">Squareから更新</button></div><p>Squareの現在庫と販売保留を確認してから変更してください。</p><p id="inventoryMessage" role="status" aria-live="polite"></p><div id="inventoryList"></div></section>
</section>
<dialog id="productEditor"><form id="productForm"><h2 id="editorTitle">商品編集</h2><label>商品名<input name="name" maxlength="120" required></label><label>URL識別子<input name="slug" pattern="[a-z0-9][a-z0-9-]{0,79}" required></label><label>説明<textarea name="description" maxlength="8000" rows="6"></textarea></label><label>表示順<input name="sortOrder" type="number" min="0" max="100000" value="0" required></label><label>画像の説明<input name="alt" maxlength="200"></label><label>写真を追加<input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple></label><p>写真は端末上で縮小・JPEG化してから送信します。変換できない形式はJPEGで選び直してください。</p><div id="imageList"></div><h3>バリエーション</h3><div id="variantList"></div><button type="button" id="addVariant" class="sub">バリエーション追加</button><p id="editorMessage" role="status"></p><div class="editor-actions"><button type="submit">下書き保存</button><button type="button" id="publishProduct">保存済みの下書きを公開</button><button type="button" id="stopProduct">販売停止</button><button type="button" id="archiveProduct">アーカイブ</button><button type="button" id="linkProduct">既存Sandbox IDを関連付け</button><button type="button" id="closeEditor" class="sub">閉じる</button></div></form></dialog>
</main>
<dialog id="detail"><button id="close" class="close">×</button><div id="detailBody"></div></dialog>
<script src="../js/store-config.js"></script><script src="../js/admin.js"></script><script src="../js/admin-management.js"></script></body></html>
