name: YASOYA | D1 overnight analytics (read-only, temporary)
on:
  push:
    branches: [fix/staging-d1-idle-reads-20261115]
    paths: [.github/workflows/d1-overnight-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare historical SQL queries without D1 database access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          url='https://api.cloudflare.com/client/v4/graphql'
          db='d16c9e56-076a-4470-8d78-4fcfbe32b4dd'
          windows=[('pre','2026-11-15T10:00:00Z','2026-11-15T11:00:00Z'),
                   ('post','2026-11-15T20:00:00Z','2026-11-15T21:00:00Z')]
          query='''query($a:string!,$db:string!,$s:Time!,$e:Time!){
            viewer{accounts(filter:{accountTag:$a}){
              d1QueriesAdaptiveGroups(limit:18,
                filter:{databaseId:$db,datetime_geq:$s,datetime_lt:$e},
                orderBy:[sum_rowsRead_DESC]){
                count sum{rowsRead rowsWritten} dimensions{query}
              }
            }}
          }'''
          headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'}
          for label,start,end in windows:
            body=json.dumps({'query':query,'variables':{
              'a':os.environ['CF_ACCOUNT'],'db':db,'s':start,'e':end}}).encode()
            req=urllib.request.Request(url,data=body,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as res: data=json.load(res)
            except urllib.error.HTTPError as err:
              print('NOT AVAILABLE',label,'HTTP',err.code)
              sys.exit(0)
            if data.get('errors'):
              print('NOT AVAILABLE',label,str(data['errors'])[:600])
              sys.exit(0)
            accounts=data.get('data',{}).get('viewer',{}).get('accounts',[])
            if not accounts:
              print('NOT AVAILABLE',label,'accounts empty')
              sys.exit(0)
            rows=accounts[0].get('d1QueriesAdaptiveGroups',[])
            print('WINDOW',label,start)
            for row in rows:
              q=' '.join((row.get('dimensions',{}).get('query') or '').split())[:220]
              print('TOPSQL',label,'rowsRead=',row.get('sum',{}).get('rowsRead'),
                'count=',row.get('count'),'SQL=',q)
          PY
