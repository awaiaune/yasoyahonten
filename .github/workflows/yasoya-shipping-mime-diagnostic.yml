name: YASOYA | Worker形式の読取診断
on:
  push:
    paths:
      - .github/workflows/yasoya-shipping-mime-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production Worker MIME structure only (no writes)
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from email import policy
          from email.parser import BytesParser
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT_ID']+'/workers/scripts/yasoya-honten-payments'
          auth={'Authorization':'Bearer '+os.environ['CF_API_TOKEN']}
          req=urllib.request.Request(root+'/content/v2',headers=auth)
          with urllib.request.urlopen(req,timeout=35) as response:
              content_type=response.headers.get('Content-Type','')
              raw=response.read(5000000)
          assert 'multipart/' in content_type,'STOP: unexpected API response type'
          marker=b'freeThreshold:3e3'
          msg=BytesParser(policy=policy.default).parsebytes(b'MIME-Version: 1.0\r\nContent-Type: '+content_type.encode()+b'\r\n\r\n'+raw)
          if not msg.is_multipart():sys.exit('STOP: not multipart')
          rows=[]
          for p in msg.iter_parts():
              name=p.get_param('name',header='content-disposition')
              data=p.get_payload(decode=True)
              rows.append({'name':str(name)[:55],'mime':p.get_content_type(),'bytes':len(data or b''),'marker':(data or b'').count(marker)})
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('## 本番Workerの読取診断（変更なし）\n')
              output.write('- MIME parts: '+str(len(rows))+'\n')
              output.write('- Response bytes: '+str(len(raw))+'\n')
              output.write('- Raw marker count: '+str(raw.count(marker))+'\n')
              for x in rows:output.write('- module '+x['name']+' / '+x['mime']+' / '+str(x['bytes'])+'bytes / marker='+str(x['marker'])+'\n')
              output.write('- 本番への変更: **なし**\n')
          print('DIAGNOSTIC',json.dumps({'raw_count':raw.count(marker),'parts':rows},ensure_ascii=False))
          PY
