name: YASOYA | CSS専用Workerを更新（商品＋SHOP）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yasoya-isolated-css-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish only two approved stylesheets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout CSS-only design branch
        uses: actions/checkout@v4
        with:
          ref: feature/product-layout-e-outline-20261112
          fetch-depth: 1
          persist-credentials: false

      - name: Verify CSS-only diff, approved settings, and live CSS hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin release/production-payment-rc-20261106
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,sys,urllib.error,urllib.request
          prefix='staging/site/css/'
          product=prefix+'managed-product.css'
          shop=prefix+'shop-gallery-v45.css'
          changed=sorted(subprocess.check_output(['git','diff','--name-only','FETCH_HEAD','HEAD'],text=True).splitlines())
          if changed!=sorted([product,shop]):
              sys.exit('STOP: unexpected files differ from original release: '+str(changed))
          proposed_product=pathlib.Path(product).read_bytes()
          proposed_shop=pathlib.Path(shop).read_bytes()
          required_product=[
              b'--yasoya-product-title-gap: 36px',
              b'--yasoya-product-image-stage: 382px',
              b'--yasoya-product-info-gap: 8px',
              b'bottom: 129px !important',
              b'border-radius: 10px',
              b'rgba(255,255,255,.055)',
              b'rgba(237,234,226,.82)'
          ]
          for token in required_product:
              if token not in proposed_product: sys.exit('STOP: missing approved product CSS value')
          if b'height:calc(100svh - 117px)!important' not in proposed_shop:
              sys.exit('STOP: approved SHOP height missing')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          # Immutable blob SHAs of the previously live product stylesheet and the original SHOP stylesheet.
          old_product='304c65a988539fc2b188a1a77195d029f3a53169'
          old_shop='a092e8342f767bad2e68dffdb8b9c0865a3ca485'
          for remote,old,current in [
              ('managed-product.css',old_product,proposed_product),
              ('shop-gallery-v45.css',old_shop,proposed_shop),
          ]:
              url='https://yasoyahonten.awaiaune.com/css/'+remote
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 YasoyaCSSSafetyCheck'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      if res.status!=200: sys.exit('STOP: live CSS HTTP '+str(res.status))
                      data=res.read(500000)
              except urllib.error.HTTPError as err:
                  sys.exit('STOP: cannot verify live '+remote+' HTTP '+str(err.code))
              digest=blob(data)
              if digest not in (old,blob(current)):
                  sys.exit('STOP: live '+remote+' has an unknown version, do not deploy')
              print('PASS CSS baseline:',remote,'current' if digest==blob(current) else 'previous')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### CSS差分確認\n- 商品詳細のPACKAGE画像ナビ bottom:129px\n- SHOP一覧 高さ calc(100svh - 117px)\n- CSS2ファイル以外のGit差分なし\n- 公開CSSは既知の旧版または新版と一致\n')
          PY

      - name: Confirm original production Worker version still matches
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          account=os.environ['CF_ACCOUNT_ID']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/yasoya-honten-payments/deployments'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: j=json.load(r)
          if j.get('success') is not True: sys.exit('STOP: Cloudflare API failure')
          ds=j.get('result',{}).get('deployments') or []
          if not ds: sys.exit('STOP: production deployment unavailable')
          active=[v for v in ds[0].get('versions',[]) if v.get('percentage')==100]
          expected='f4a0fc4a-3023-495b-9821-ee9f5dfc4b82'
          if len(active)!=1 or active[0].get('version_id')!=expected:
              sys.exit('STOP: original production Worker version changed')
          print('PASS: original production Worker stays at its approved 100% version')
          PY

      - name: Build isolated CSS Worker with two exact paths
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          directory=pathlib.Path('staging/site/css')
          files={
              '/css/managed-product.css':(directory/'managed-product.css').read_text('utf-8'),
              '/css/shop-gallery-v45.css':(directory/'shop-gallery-v45.css').read_text('utf-8'),
          }
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'yasoya-css-worker'
          folder.mkdir(parents=True,exist_ok=True)
          code=(
              '// YASOYA: only two exact CSS paths, no purchase/admin/SEO logic.\n'
              'const STYLES='+json.dumps(files,ensure_ascii=False)+';\n'
              'export default { async fetch(request) {\n'
              '  const url=new URL(request.url);\n'
              '  if(!Object.prototype.hasOwnProperty.call(STYLES,url.pathname)) return new Response("Not Found",{status:404});\n'
              '  if(!["GET","HEAD"].includes(request.method)) return new Response("Method Not Allowed",{status:405});\n'
              '  const headers={"Content-Type":"text/css; charset=utf-8","Cache-Control":"no-store","X-Content-Type-Options":"nosniff"};\n'
              '  return new Response(request.method==="HEAD"?null:STYLES[url.pathname],{status:200,headers});\n'
              '} };\n'
          )
          (folder/'index.js').write_text(code,'utf-8')
          conf={'name':'yasoya-product-css-20261112','main':'./index.js','compatibility_date':'2026-11-12','workers_dev':True,'send_metrics':False}
          (folder/'wrangler.jsonc').write_text(json.dumps(conf,indent=2),'utf-8')
          print('CSS-only Worker ready, two specific paths, no production route edits.')
          PY

      - name: Deploy isolated CSS Worker only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npx --yes wrangler@4.155.0 deploy --config "$RUNNER_TEMP/yasoya-css-worker/wrangler.jsonc"
          echo "Separate CSS Worker updated. No changes to the original payment Worker or zone routes." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify product CSS is now served; original Worker unchanged
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys,time,urllib.error,urllib.request
          target=pathlib.Path('staging/site/css/managed-product.css').read_bytes()
          url='https://yasoyahonten.awaiaune.com/css/managed-product.css'
          good=False
          for i in range(5):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 YasoyaCSSPostDeploy'}),timeout=25) as resp:
                      good=resp.status==200 and resp.read(500000)==target
              except urllib.error.HTTPError:
                  good=False
              if good: break
              time.sleep(2)
          if not good: sys.exit('STOP: product CSS not confirmed at live route after isolated Worker deploy')
          account=os.environ['CF_ACCOUNT_ID']
          u=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/yasoya-honten-payments/deployments'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as res: j=json.load(res)
          ds=j['result']['deployments']
          active=[v for v in ds[0].get('versions',[]) if v.get('percentage')==100]
          if len(active)!=1 or active[0].get('version_id')!='f4a0fc4a-3023-495b-9821-ee9f5dfc4b82':
              sys.exit('STOP: purchase Worker version changed after CSS release')
          print('SUCCESS: product CSS deployed, original Worker version unchanged')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n### 公開結果\n- 商品詳細のCSSは本番URLで新バージョン確認済み\n- 元の購入Workerは変更なし\n- SHOP用CSSは専用Workerに格納済み。SHOPルートは未設定ならCloudflareで追加が必要\n')
          PY
