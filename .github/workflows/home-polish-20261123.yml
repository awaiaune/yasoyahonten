name: YASOYA | トップ説明文と植物名の位置を調整
on:
  push:
    branches: [release/live-ui-20261123]
    paths: [.github/workflows/home-polish-20261123.yml, maintenance/home-polish-20261123/**]
permissions:
  contents: read
  actions: read
concurrency:
  group: yasoya-home-polish-20261123
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: yasoya-ui-original-snapshot
          run-id: 45131236331
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yasoya-home-assets
      - name: Read current production source and prepare three scoped presentation changes
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 maintenance/home-polish-20261123/prepare.py --check-cloud --assets "$RUNNER_TEMP/yasoya-home-assets" --out "$RUNNER_TEMP/yasoya-home-candidate"
      - name: Prepare isolated browser tests before any upload or deployment
        run: |
          npm install --prefix "$RUNNER_TEMP/yasoya-home-deps" --no-audit --no-fund miniflare@4.20260730.0 playwright@1.57.0
          node "$RUNNER_TEMP/yasoya-home-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify names from published data, metadata-only description, unchanged product UI, mobile and desktop
        env:
          UI_BROWSER_TESTS: '1'
        run: |
          export UI_TEST_NODE_MODULES="$RUNNER_TEMP/yasoya-home-deps/node_modules"
          export UI_LIVE_DIR="$RUNNER_TEMP/yasoya-home-assets"
          export UI_CANDIDATE_DIR="$RUNNER_TEMP/yasoya-home-candidate"
          node --test --test-concurrency=1 maintenance/home-polish-20261123/verify.mjs
      - name: Upload inactive storefront version with original assets and all bindings inherited
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 maintenance/ui-stage-20261123.py --live "$RUNNER_TEMP/yasoya-home-candidate/live" --candidate "$RUNNER_TEMP/yasoya-home-candidate"
      - name: Activate scoped storefront version and compare actual pages
        id: activate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 maintenance/home-polish-20261123/deploy.py --live "$RUNNER_TEMP/yasoya-home-candidate/live" --candidate "$RUNNER_TEMP/yasoya-home-candidate" --out "$RUNNER_TEMP/yasoya-home-production"
      - name: Check actual production mobile and desktop layout
        run: |
          export UI_TEST_NODE_MODULES="$RUNNER_TEMP/yasoya-home-deps/node_modules"
          export UI_DEPLOYMENT_DIR="$RUNNER_TEMP/yasoya-home-production"
          node maintenance/home-polish-20261123/production-browser.mjs
      - name: Restore original storefront version if live browser checks fail
        if: failure() && steps.activate.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 maintenance/home-polish-20261123/deploy.py --rollback --live "$RUNNER_TEMP/yasoya-home-candidate/live" --candidate "$RUNNER_TEMP/yasoya-home-candidate" --out "$RUNNER_TEMP/yasoya-home-production"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yasoya-home-polish-candidate
          path: ${{ runner.temp }}/yasoya-home-candidate
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yasoya-home-polish-production
          path: ${{ runner.temp }}/yasoya-home-production
          retention-days: 30
