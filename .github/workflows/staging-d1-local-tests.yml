name: YASOYA staging D1 read-budget unit tests
on:
  push:
    branches:
      - fix/staging-d1-idle-reads-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline JavaScript tests (no Cloudflare credentials or D1 connection)
        run: node --test staging/tests/d1-read-budget.test.mjs
